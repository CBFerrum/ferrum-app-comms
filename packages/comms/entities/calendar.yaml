- name: CalendarEventAttendee
  label: Attendee
  kind: child
  fields:
    - {name: email, type: email, required: true, in_list: true, description: "A colleague's sign-in email or an outside address (outside guests get an invitation email)"}
    - {name: attendee_name, type: data, in_list: true}
    - {name: response, type: select, options: [Needs Action, Accepted, Declined, Tentative], default: Needs Action, required: true, in_list: true}
    - {name: comment, type: text, max_length: 500, description: A note that came with their answer}

- name: CalendarEventReminder
  label: Reminder
  kind: child
  fields:
    - {name: minutes_before, type: int, required: true, default: 15, min: 0, max: 40320, in_list: true}

- name: CalendarShare
  label: Calendar Share
  kind: child
  fields:
    - {name: person, type: email, in_list: true, description: "An active colleague's sign-in email (or a group: role)"}
    - {name: role, type: data, label: Group, in_list: true, description: "A group of the workspace (a role): everyone holding it now, checked on every request"}
    - {name: level, type: select, options: [Free/busy, Details, Edit], default: Details, required: true, in_list: true, description: "Free/busy: when, as Busy; Details: everything; Edit: everything, and changes"}

- name: CalendarBooker
  label: Who may book
  kind: child
  fields:
    - {name: person, type: email, in_list: true, description: "A colleague's sign-in email (or a group: role)"}
    - {name: role, type: data, label: Group, in_list: true}

- name: Calendar
  label: Calendar
  label_plural: Calendars
  kind: master
  module: communication
  title_field: calendar_name
  description: "A person's calendar: every event belongs to one of its organizer's calendars. Shared with colleagues at a level; managed through /api/app/comms/calendar/calendars."
  owner_fields: [owner]
  fields:
    - {name: calendar_name, type: data, label: Name, required: true, in_list: true}
    - {name: owner, type: email, read_only: true, in_list: true, in_filter: true}
    - {name: tone, type: select, options: [blue, green, amber, red, purple, neutral], default: blue, required: true, description: "Its colour, from the interface's tone palette"}
    - {name: hidden, type: check, description: Not drawn on its owner's calendar}
    - {name: is_default, type: check, read_only: true, description: Where new events go}
    - {name: shares, type: table, of: CalendarShare}
    - {name: dav_path, type: data, read_only: true, description: "The address a calendar app gave it when it made it (CalDAV MKCALENDAR)"}
    - {name: is_subscription, type: check, read_only: true, description: "Subscribed to from outside by its address: its events are fetched, read-only"}
    - {name: feed_url, type: secret, description: "A subscription's address (it may carry the publisher's secret): never shown again"}
    - {name: feed_label, type: data, read_only: true, description: "A subscription's address without anything secret (its host)"}
    - {name: remind, type: check, description: "A subscription's events remind (they never do otherwise)"}
    - {name: fetched_at, type: datetime, read_only: true, description: When the subscription was last fetched successfully}
    - {name: fetch_result, type: data, read_only: true, description: "What the last fetch did, or why it failed"}
    - {name: fetch_failures, type: int, read_only: true, description: "Failed fetches in a row (each waits longer, up to a day)"}
    - {name: next_fetch_at, type: datetime, read_only: true}
    - {name: fetch_etag, type: data, read_only: true}
    - {name: fetch_modified, type: data, read_only: true}
    - {name: kind, type: select, options: [Calendar, Room, Resource], default: Calendar, in_filter: true, description: "A room or a resource is booked by adding its address (its owner) to an event as a guest; kept by Comms Managers"}
    - {name: capacity, type: int, min: 1, description: How many people a room holds}
    - {name: place, type: data, description: "Where a room or resource is (building, floor)"}
    - {name: bookable, type: json, description: "When a room or resource may be booked: {days, from, to, timezone}; any time when empty"}
    - {name: bookers, type: table, of: CalendarBooker, description: Who may book a room or resource; everyone when empty}
  indexes: [[owner], [next_fetch_at]]
  list: {columns: [calendar_name, owner], sort: calendar_name asc}

- name: CalendarEvent
  label: Event
  label_plural: Events
  kind: master
  module: communication
  title_field: subject
  description: "Calendar event; times are stored in UTC and recurrences repeat at the same wall-clock time in the event's time zone. Attendees see the events they are invited to; only the organizer edits them."
  owner_fields: [owner, attendees.email]
  fields:
    - {name: subject, type: data, required: true, in_list: true}
    - {name: starts_at, type: datetime, required: true, in_list: true}
    - {name: ends_at, type: datetime, required: true, in_list: true}
    - {name: all_day, type: check, description: "Whole days: starts_at and ends_at are midnights (UTC), ends_at exclusive"}
    - {name: timezone, type: data, description: "IANA time zone of the event (e.g. Asia/Kolkata): it is shown in it and repeats at the same wall-clock time in it across daylight-saving changes"}
    - {name: location, type: data}
    - {name: meeting_link, type: url}
    - {name: description, type: text}
    - {name: description_html, type: text, label: Notes (rich text), description: "The notes with their formatting, made safe as Mail makes outgoing mail safe; description keeps their words as plain text"}
    - {name: attachments, type: json, description: "Files from Drive, by reference: [{id, name, size}] (at most 20); opened in Drive, by those Drive lets open them"}
    - {name: category, type: data, in_filter: true}
    - {name: color, type: color}
    - {name: owner, type: email, label: Organizer, read_only: true, in_list: true, in_filter: true}
    - {name: calendar, type: link, to: Calendar, in_filter: true, description: "The organizer's calendar it is in (their default when none is given)"}
    - {name: visibility, type: select, options: [Private, Public, Busy only], default: Private, required: true, in_filter: true, description: "Public events show on everyone's calendar; private ones to the organizer, attendees and those the calendar is shared with; busy-only ones show as busy time even in a shared calendar"}
    - {name: status, type: select, options: [Confirmed, Tentative, Cancelled], default: Confirmed, required: true, in_list: true, in_filter: true}
    - {name: attendees, type: table, of: CalendarEventAttendee}
    - {name: recurrence, type: data, max_length: 500, description: "RRULE: FREQ=DAILY|WEEKLY|MONTHLY|YEARLY with INTERVAL, BYDAY, BYMONTHDAY, COUNT or UNTIL (a date: that day in the event's zone; or a UTC time), e.g. FREQ=WEEKLY;BYDAY=MO,WE;COUNT=10"}
    - {name: recurrence_exceptions, type: json, description: "Occurrences to skip: their start dates in the event's zone (YYYY-MM-DD) or start times (RFC 3339)"}
    - {name: reminders, type: table, of: CalendarEventReminder}
    - {name: reference_entity, type: data}
    - {name: reference_id, type: data}
    - {name: ical_uid, type: data, label: iCalendar UID, read_only: true, no_copy: true}
    - {name: sequence, type: int, read_only: true, no_copy: true}
    - {name: organizer, type: email, label: Invited by, read_only: true, no_copy: true, description: "For an event taken from an invitation: who sent it (its ORGANIZER). Only they can cancel it by mail. Events taken before Ferrum 0.14 have none."}
    - {name: fetched, type: check, read_only: true, no_copy: true, description: "Copied from a calendar subscribed to by its address: changed only by fetching it again; never invites or exports"}
  unique: [[owner, ical_uid]]
  indexes: [[starts_at], [owner], [calendar]]
  form:
    - {label: Event, fields: [subject, starts_at, ends_at, all_day, timezone, location, meeting_link, status, visibility]}
    - {label: People, fields: [owner, attendees]}
    - {label: Repeat & Remind, collapsible: true, fields: [recurrence, recurrence_exceptions, reminders]}
    - {label: Details, collapsible: true, fields: [description, category, color, reference_entity, reference_id, ical_uid, sequence, organizer]}
  list: {columns: [starts_at, subject, owner, status], sort: starts_at desc}

- name: CalendarFeed
  label: Calendar Feed
  kind: master
  title_field: person
  description: "A person's secret calendar feed address, managed through /api/app/comms/calendar/feed."
  fields:
    - {name: person, type: email, required: true, unique: true, in_list: true}
    - {name: token, type: secret, read_only: true}
