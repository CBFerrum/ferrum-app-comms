- name: ChatChannelMember
  label: Channel Member
  kind: child
  fields:
    - {name: member, type: email, required: true, in_list: true, description: Email the member signs in with}
    - {name: role, type: select, options: [Owner, Member], default: Member, required: true, in_list: true}
    - {name: last_read_at, type: datetime, in_list: true}
    - {name: notify_level, type: select, options: [All, Mentions, Nothing], description: "How loud the channel is for this member: every message, mentions and replies in their threads, or nothing (muted). Empty: everything in a direct message, mentions in a channel"}

- name: ChatChannel
  label: Chat Channel
  kind: master
  module: communication
  title_field: channel_name
  description: "Team chat channel. People use chat through /api/app/comms/chat, which enforces membership; this generic view is for chat administrators."
  fields:
    - {name: channel_name, type: data, required: true, unique: true, max_length: 80, in_list: true}
    - {name: channel_type, type: select, options: [Public, Private, Direct], default: Public, required: true, in_list: true, in_filter: true}
    - {name: topic, type: text, max_length: 500}
    - {name: members, type: table, of: ChatChannelMember}
    - {name: archived, type: check, in_list: true, in_filter: true}
    - {name: post_policy, type: select, options: [Members, Owners], default: Members, in_filter: true, description: "Who starts posts: every member, or only the owners (members still reply in threads)"}
    - {name: direct_key, type: data, unique: true, read_only: true, hidden: true, no_copy: true}
    - {name: last_message_at, type: datetime, read_only: true, no_copy: true, in_list: true}
  list: {columns: [channel_name, channel_type, archived, last_message_at], sort: channel_name asc}

- name: ChatMessage
  label: Chat Message
  kind: master
  module: communication
  description: "Markdown message (at most 4 KB) in a channel; replies point at their thread's first message."
  search_fields: [body]
  fields:
    - {name: channel, type: link, to: ChatChannel, required: true, on_delete: cascade, in_list: true, in_filter: true}
    - {name: sender, type: email, read_only: true, in_list: true}
    - {name: body, type: markdown, max_length: 4096, in_list: true}
    - {name: parent_message, type: link, to: ChatMessage, on_delete: cascade, in_filter: true, description: First message of the thread this replies to}
    - {name: mentions, type: json, description: Emails of the members mentioned}
    - {name: attachments, type: json, description: "[{id, file_name, content_type, size, url}]: files from /api/files"}
    - {name: posted_at, type: datetime, read_only: true, no_copy: true, in_list: true}
    - {name: edited_at, type: datetime, read_only: true, no_copy: true}
    - {name: deleted, type: check, read_only: true, in_filter: true}
    - {name: reactions, type: json, read_only: true, no_copy: true, description: "{emoji: [addresses of the members who reacted with it]}; changed only by the React and Remove Reaction actions"}
    - {name: pinned_at, type: datetime, read_only: true, no_copy: true, in_filter: true, description: "When it was pinned in its channel; empty when it is not"}
  indexes: [[channel, posted_at], [parent_message, posted_at], [channel, pinned_at]]
  list: {columns: [posted_at, channel, sender, body], sort: posted_at desc}
  # Chat's own buttons (hidden from the generic record page), and operations for a member's agent. A member reads
  # their own channels' messages (package.yaml, Comms User), and the handler checks membership again (src/chat.rs).
  actions:
    - name: react
      label: React
      permission: read
      hidden: true
      params:
        - {name: emoji, label: Emoji, type: data, required: true, description: "One emoji, at most 32 bytes"}
      contract:
        effect: transactional_action
        completion: The caller's reaction is on the message and the channel's members were told
        compensate_with: unreact
        returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ChatMessage}, reactions: {type: object}}}
    - name: unreact
      label: Remove Reaction
      permission: read
      hidden: true
      params:
        - {name: emoji, label: Emoji, type: data, required: true, description: "The emoji to take back"}
      contract:
        effect: transactional_action
        completion: The caller's reaction with that emoji is gone and the channel's members were told
        compensate_with: react
        returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ChatMessage}, reactions: {type: object}}}
    - name: pin
      label: Pin
      permission: read
      hidden: true
      contract:
        effect: transactional_action
        completion: The message is pinned in its channel and the channel's members were told
        compensate_with: unpin
        returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ChatMessage}, pinned_at: {type: [string, "null"]}}}
    - name: unpin
      label: Unpin
      permission: read
      hidden: true
      contract:
        effect: transactional_action
        completion: The message is no longer pinned and the channel's members were told
        compensate_with: pin
        returns: {type: object, properties: {id: {type: string, format: uuid, x-ferrum-link: ChatMessage}, pinned_at: {type: [string, "null"]}}}
