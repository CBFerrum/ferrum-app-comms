[package]
name = "ferrum-app-comms"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Messaging, mail and calendar: email accounts (SMTP/IMAP), threaded communications on any record, templates, newsletters, team chat and calendars with ICS."
repository = "https://github.com/CBFerrum/ferrum-app-comms"
build = "build.rs"

[dependencies]
ferrum-kernel = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-meta = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-domain = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
async-trait = "0.1"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
regex = "1"
hmac = "0.12"
base64 = "0.22"
rand = "0.9"
# Same feature set as Loco's mailer, so a server build compiles lettre once.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
minijinja = { version = "2", features = ["fuel"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
webpki-roots = "1"
chrono-tz = { version = "0.10", default-features = false }
ammonia = "4"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.43", features = ["serde-with-str", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }

[dev-dependencies]

[lints.clippy]
# Deliberate patterns shared with the platform: sqlx row tuples, index-based maths, engine entry points.
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
