id: comms
name: Mail, Chat and Calendar
version: 0.14.0
publisher: cbferrum
summary: Email accounts (SMTP/IMAP), threaded communications on any record, templates, newsletters, team chat, calendars with ICS and calendar-app sync, contacts sync and video meetings
description: README.md
categories: [communication, productivity]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-comms
support: https://github.com/CBFerrum/ferrum-app-comms/issues
runtime: native
platform: ">=0.3.2, <0.4"
packages: [comms]
uninstall: ask
# Comms' own interface (Ferrum docs/plan/apps-ui.md): one interface, four routes.
ui:
  dist: ui/dist
  csp:
    # LiveKit as browsers reach it (FERRUM_MEET_URL): calls connect there, over WebSocket and HTTPS.
    connect: ["env:FERRUM_MEET_URL"]
    # Mail shows remote images when asked to (they load in the message's frame).
    img: ["https:"]
contributes:
  shell.app:
    - {id: mail, route: mail, title: Mail, description: Your mailbox and the shared ones, icon: mail, color: "#2563eb", roles: [Comms User, Comms Manager]}
    - {id: chat, route: chat, title: Chat, description: Conversations with your team, icon: message-square, color: "#0891b2", roles: [Comms User, Comms Manager]}
    - {id: calendar, route: calendar, title: Calendar, description: Your events and meetings, icon: calendar, color: "#7c3aed", roles: [Comms User, Comms Manager]}
    - {id: meet, route: meet, title: Meet, description: Video meetings, icon: video, color: "#16a34a", compact: true, roles: [Comms User, Comms Manager]}
  shell.create:
    - {id: email, label: Email, path: mail/compose}
  # What Comms does for other apps (Ferrum docs/plan/apps-ui.md §11.3): `compose email`
  # ({to, cc, subject, body, attachments: [{url, name}]}), `schedule event` ({subject, starts_at,
  # ends_at, attendees, location, description, meeting, record: {entity, id}}) and `share record`
  # ({entity, id, title}) to a chat conversation.
  shell.intent:
    - {id: compose, action: compose, type: email, path: mail/_intent/compose, title: Write an email}
    - {id: schedule, action: schedule, type: event, path: calendar/_intent/schedule, title: Schedule a meeting}
    - {id: share, action: share, type: record, path: chat/_intent/share, title: Share in Chat}
  shell.sidepanel:
    - {id: chat, title: Chat, path: chat/_panel}
  # A channel opens in Chat (`/open/ChatChannel/{id}`: links, search results, notifications), a
  # message in its channel at that message (what a mention's notification links to), and an event
  # in Calendar (an invitation's notification opens it to be answered; `new` is the editor).
  shell.open:
    - {id: channel, entity: ChatChannel, path: "chat/{id}"}
    - {id: message, entity: ChatMessage, path: "chat/m/{id}"}
    - {id: event, entity: CalendarEvent, path: "calendar/e/{id}"}
    # A new-mail notification opens the message (or the Inbox for several): not a record, a notice
    # the server keeps for that person (src/arrivals.rs).
    - {id: newmail, entity: MailMessage, path: "mail/n/{id}"}
  # The bar's search asks Chat for the messages the person may read (Ferrum apps-ui.md §12.8).
  shell.search:
    - {id: chat, title: Chat, endpoint: /api/app/comms/chat/search}
  # Home's My work asks Calendar for the invitations to answer (Ferrum apps-ui.md §11.8).
  shell.work:
    - {id: invitations, title: Invitations, endpoint: /api/app/comms/calendar/invitations}
  # The kinds of notification Comms sends ({app}.{id}, as src/ sends them, with these defaults);
  # each person chooses how each reaches them (Ferrum apps-ui.md §12.8).
  shell.notification:
    - {id: invitation, label: Calendar invitations and changes to them, default: [inapp]}
    - {id: rsvp, label: Answers to your invitations, default: [inapp]}
    - {id: reminder, label: Event reminders, default: [inapp]}
    - {id: mention, label: Someone mentions you in Chat, default: [inapp]}
    - {id: direct, label: Direct messages in Chat, default: [inapp]}
    - {id: thread, label: Replies in Chat threads you take part in, default: [inapp]}
    - {id: channel, label: Every message in the Chat channels you chose to hear in full, default: [inapp]}
    - {id: newmail, label: New mail in your inbox (Mail's settings choose which), default: [inapp]}
    - {id: reply, label: Replies to email you sent, default: [inapp]}
    - {id: undelivered, label: Email you sent that could not be delivered, default: [inapp]}
  # Pages anyone with a link opens: a meeting's guest page, and where a guest answers an invitation.
  shell.public:
    - {id: guest, path: meet/guest, title: Meeting}
    - {id: rsvp, path: calendar/rsvp, title: Reply to an invitation}
  # What the assistant should know in Mail, Chat and Calendar's pages, and what it suggests asking there.
  shell.assistant:
    - id: comms
      title: "Mail, Chat and Calendar"
      instructions: >-
        Mail sent and received about records is kept as Communication (Queued, Sending, Sent, Failed, Received),
        threaded on the record it is about. A CalendarEvent is Confirmed, Tentative or Cancelled, with its attendees
        and reminders. ChatChannel and ChatMessage are team chat. A Newsletter goes to email groups and is Draft,
        Scheduled, Sending, Sent or Cancelled. Mailboxes and email accounts are set up by administrators.
      suggestions:
        - "What meetings do I have tomorrow?"
        - "Which emails to customers failed to send today?"
        - "Summarize the latest messages in a channel"
        - "Which newsletters are scheduled?"
